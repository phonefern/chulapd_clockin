name: Pre-shift reminders

permissions: {}

on:
  schedule:
    # GitHub cron uses UTC. These run at 08:20 and 16:20 Asia/Bangkok, Monday-Friday.
    - cron: "20 1 * * 1-5"
    - cron: "20 9 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: "Reminder phase to send"
        required: true
        default: "start"
        type: choice
        options:
          - start
          - end

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Resolve phase
        id: phase
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            phase="${{ inputs.phase }}"
          elif [[ "${{ github.event.schedule }}" == "20 1 * * 1-5" ]]; then
            phase="start"
          else
            phase="end"
          fi

          echo "phase=${phase}" >> "$GITHUB_OUTPUT"

      - name: Trigger reminder endpoint
        shell: bash
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          if [[ -z "$APP_BASE_URL" ]]; then
            echo "APP_BASE_URL repository variable or secret is required" >&2
            exit 1
          fi

          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET secret is required" >&2
            exit 1
          fi

          curl --fail --show-error --silent \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/pre-shift-reminder?phase=${PHASE}"
